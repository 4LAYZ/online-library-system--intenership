<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Online Library Payment</title>

<style>
body{
    font-family: Arial;
    background: linear-gradient(to right, #4facfe, #00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

/* BACK BUTTON */
.back{
    position: fixed;
    top: 20px;
    left: 20px;
    text-decoration: none;
    background: white;
    padding: 8px 12px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    font-weight: bold;
    color: black;
}

.container{
    background:white;
    padding:25px;
    width:360px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:15px;
}

input, select, button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
}

button{
    background:#007bff;
    color:white;
    font-weight:bold;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.hidden{ display:none; }

.loader{
    text-align:center;
    margin-top:15px;
    display:none;
    font-weight:bold;
    color:#007bff;
}

.ticket{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:#f9f9f9;
    border:1px solid #ddd;
}

#downloadBtn{
    background:green;
}
</style>

</head>
<body>

<!-- BACK BUTTON -->
<a href="book.html" class="back">← Back</a>

<div class="container">

<h2>Buy Book</h2>

<input type="text" id="name" placeholder="Full Name">
<input type="number" id="amount" placeholder="Amount (RWF)">

<select id="payment" onchange="showFields()">
    <option value="">Select Payment Method</option>
    <option value="MTN">MTN MoMo</option>
    <option value="AIRTEL">Airtel Money</option>
    <option value="VISA">Visa Card</option>
</select>

<div id="mobileField" class="hidden">
    <input type="text" id="phone" placeholder="Phone Number">
</div>

<div id="cardField" class="hidden">
    <input type="text" placeholder="Card Number">
    <input type="text" placeholder="Expiry Date">
    <input type="text" placeholder="CVV">
</div>

<button onclick="payNow()">Pay Now</button>

<div class="loader" id="loader">Processing Payment...</div>

<div class="ticket" id="ticket">
    <h3>Payment Receipt</h3>
    <p id="t_name"></p>
    <p id="t_amount"></p>
    <p id="t_method"></p>
    <p id="t_ref"></p>

    <button id="downloadBtn" onclick="downloadBook()">
        Now Free to Download Book
    </button>
</div>

</div>

<script>
function showFields(){
    let method = document.getElementById("payment").value;

    document.getElementById("mobileField").style.display =
        (method === "MTN" || method === "AIRTEL") ? "block" : "none";

    document.getElementById("cardField").style.display =
        (method === "VISA") ? "block" : "none";
}

function payNow(){
    let name = document.getElementById("name").value;
    let amount = document.getElementById("amount").value;
    let method = document.getElementById("payment").value;

    if(name === "" || amount === "" || method === ""){
        alert("Fill all fields");
        return;
    }

    document.getElementById("loader").style.display = "block";

    setTimeout(() => {
        document.getElementById("loader").style.display = "none";

        let ref = "TXN" + Math.floor(Math.random()*1000000);

        document.getElementById("ticket").style.display = "block";
        document.getElementById("t_name").innerHTML = "Name: " + name;
        document.getElementById("t_amount").innerHTML = "Amount: " + amount + " RWF";
        document.getElementById("t_method").innerHTML = "Method: " + method;
        document.getElementById("t_ref").innerHTML = "Reference: " + ref;

    }, 2500);
}

function downloadBook(){
    let content = "ONLINE LIBRARY DEMO BOOK\n\nYou downloaded successfully.";
    let blob = new Blob([content], { type: "text/plain" });

    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "Demo_Book.txt";
    link.click();
}
</script>

</body>
</html>
