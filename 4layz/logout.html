<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logout</title>

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

/* BODY */
body{
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg, #141e30, #243b55);

  display:flex;
  justify-content:center;
  align-items:center;

  min-height:100vh;
  padding:20px;
}

/* CARD */
.card{
  background:white;
  width:360px;

  padding:30px;
  border-radius:14px;

  text-align:center;

  box-shadow:0 10px 30px rgba(0,0,0,0.3);

  position:relative;

  animation:fadeIn 0.5s ease;
}

/* ANIMATION */
@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* BACK BUTTON */
.back-btn{
  position:absolute;
  top:15px;
  left:15px;

  background:#f1f1f1;
  color:#333;

  border:none;
  padding:8px 14px;

  border-radius:6px;

  cursor:pointer;
  font-size:14px;

  transition:0.3s;
}

.back-btn:hover{
  background:#ddd;
}

/* ICON */
.icon{
  font-size:55px;
  margin-bottom:10px;
}

/* TITLE */
h2{
  margin:10px 0;
  color:#222;
}

/* PARAGRAPH */
p{
  font-size:15px;
  color:#555;
  margin-bottom:20px;
}

/* BUTTONS */
.btn{
  display:block;
  width:100%;

  padding:12px;
  margin-top:12px;

  border:none;
  border-radius:6px;

  cursor:pointer;

  font-size:15px;
  text-decoration:none;

  text-align:center;

  transition:0.3s;
}

/* LOGOUT BUTTON */
.logout{
  background:#e74c3c;
  color:white;
}

.logout:hover{
  background:#c0392b;
}

/* SAVE LOGIN */
.save{
  background:#2ecc71;
  color:white;
}

.save:hover{
  background:#27ae60;
}

/* NOT NOW */
.notnow{
  background:#3498db;
  color:white;
}

.notnow:hover{
  background:#2980b9;
}

/* SMALL TEXT */
.small{
  margin-top:18px;
  font-size:13px;
  color:#777;
}

</style>
</head>

<body>

<div class="card">

  <!-- BACK BUTTON -->
  <button class="back-btn" onclick="goBack()">← Back</button>

  <!-- ICON -->
  <div class="icon">🚪</div>

  <!-- TITLE -->
  <h2>Are you sure?</h2>

  <!-- MESSAGE -->
  <p>You are about to leave your account.</p>

  <!-- LOGOUT -->
  <a href="login.html" class="btn logout" onclick="logoutUser()">
    Logout
  </a>

  <!-- SAVE LOGIN -->
  <button class="btn save" onclick="saveLogin()">
    Save Login
  </button>

  <!-- NOT NOW -->
  <a href="continue.html" class="btn notnow">
    Not Now
  </a>

  <!-- FOOTER TEXT -->
  <div class="small">
    You can always come back later.
  </div>

</div>

<script>

/* BACK BUTTON */
function goBack(){
  window.history.back();
}

/* SAVE LOGIN */
function saveLogin(){

  localStorage.setItem("savedLogin", "true");

  alert("✅ Login saved successfully on this device!");
}

/* LOGOUT FUNCTION */
function logoutUser(){

  // REMOVE SAVED LOGIN
  localStorage.removeItem("savedLogin");

  // OPTIONAL MESSAGE
  alert("✅ Logged out successfully!");
}

</script>

</body>
</html>
