<!DOCTYPE html>
<html>
<head>
<title>Borrow Book</title>

<style>
body {
    background: url('https://images.unsplash.com/photo-1512820790803-83ca734da794') no-repeat center/cover;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    margin: 0;
}

/* Back Button (Top Left) */
.back-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 18px;
    background: #ff4b5c;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.3s;
}

.back-btn:hover {
    background: #c0392b;
}

.box {
    background: rgba(0,0,0,0.7);
    margin: 120px auto;
    padding: 30px;
    width: 60%;
    border-radius: 10px;
}

a {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 20px;
    background: #00c6ff;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    transition: 0.3s;
}

a:hover {
    background: #0072ff;
}
</style>

</head>

<body>

<!-- Back Button -->
<button class="back-btn" onclick="history.back()">⬅ Back</button>

<div class="box">
    <h1>Borrow Book</h1>
    <p>Select a book and borrow for 7 days.</p>
    <a href="select book.html">Borrow Book</a>
</div>

</body>
</html>
