<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #232526, #414345);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: white;
  width: 360px;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

h2 {
  text-align: center;
}

label {
  font-size: 13px;
  margin-top: 10px;
  display: block;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

.error {
  color: hsl(231, 100%, 50%);
  font-size: 12px;
  margin-top: 5px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 6px;
  background: #2ecc71;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #27ae60;
}

.link {
  text-align: center;
  margin-top: 10px;
  font-size: 13px;
}

.link a {
  color: #3498db;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="card">
  <h2>Create Account</h2>

  <form onsubmit="return validateRegister(event)">

    <label>Full Name</label>
    <input type="text" id="name" placeholder="Enter full name">
    <div class="error" id="nameError"></div>

    <label>Email</label>
    <input type="email" id="email" placeholder="Enter email">
    <div class="error" id="emailError"></div>

    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password">
    <div class="error" id="passError"></div>

    <label>Confirm Password</label>
    <input type="password" id="confirm" placeholder="Confirm password">
    <div class="error" id="confirmError"></div>

    <button type="submit">Register</button>

  </form>

  <div class="link">
    Already have an account? <a href="login.html">Login</a>
  </div>
</div>

<script>
function validateRegister(event) {
    event.preventDefault();

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let pass = document.getElementById("password").value;
    let confirm = document.getElementById("confirm").value;

    let nameError = document.getElementById("nameError");
    let emailError = document.getElementById("emailError");
    let passError = document.getElementById("passError");
    let confirmError = document.getElementById("confirmError");

    
    nameError.innerText = "";
    emailError.innerText = "";
    passError.innerText = "";
    confirmError.innerText = "";

    let valid = true;

    
    if (name === "") {
        nameError.innerText = "Full name is required!";
        valid = false;
    }else if (!name.includes("first and last name")){
      nameError.innerText = "invalid name format!";
      valid =false;
    }

    
    if (email === "") {
        emailError.innerText = "Email is required!";
        valid = false;
    } else if (!email.includes("@")) {
        emailError.innerText = "Invalid email format!";
        valid = false;
    }

    
    if (pass.length < 6) {
        passError.innerText = "Password must be at least 6 characters!";
        valid = false;
    }

    
    if (confirm !== pass) {
        confirmError.innerText = "Passwords do not match!";
        valid = false;
    }

    
    if (valid) {
        alert("Account created successfully!");
        window.location.href = "login.html";
    }

    return false;
}
</script>

</body>
</html>
