<!DOCTYPE html>
<html>
<head>
<title>Programming Books</title>

<style>
body {
    font-family: Arial;
    background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba') no-repeat center/cover;
    margin: 0;
}

/* BACK BUTTON */
.back-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    background: #ff4d4d;
    color: white;
    padding: 10px 15px;
    border-radius: 5px;
    text-decoration: none;
    font-weight: bold;
}

/* CONTAINER */
.container {
    background: rgba(0,0,0,0.7);
    color: white;
    width: 90%;
    margin: 80px auto 40px;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

.books {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-top: 20px;
}

.book {
    background: white;
    color: black;
    border-radius: 10px;
    padding: 10px;
}

.book img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 8px;
}

.book a {
    display: inline-block;
    margin-top: 5px;
    padding: 5px 10px;
    background: #2f86c1;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}
</style>
</head>

<body>

<!-- BACK BUTTON -->
<a href="javascript:history.back()" class="back-btn">⬅ Back</a>

<div class="container">
<h1>ONLINE PROGRAMMING BOOKS</h1>

<div class="books">

    <div class="book">
        <img src="https://covers.openlibrary.org/b/id/8231996-L.jpg">
        <h4>Programming Basics</h4>
        <p>7 days to return back</p>
        <a href="BUY ONLINE.html" target="_blank">BORROW ONLINE</a>
    </div>

    <div class="book">
        <img src="https://covers.openlibrary.org/b/id/8228691-L.jpg">
        <h4>Intro to Coding</h4>
        <p>7 days to return back</p>
        <a href="BUY ONLINE.html" target="_blank">BORROW ONLINE</a>
    </div>

    <div class="book">
        <img src="https://covers.openlibrary.org/b/id/8235080-L.jpg">
        <h4>HTML & CSS</h4>
        <p>7 days to return back</p>
        <a href="BUY ONLINE.html" target="_blank">BORROW ONLINE</a>
    </div>

</div>
</div>

</body>
</html>
